<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14382F">
<title>عقار | بشائر للعقارات</title>
<!--OG--><!--/OG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="assets/style.css">
<style>:root{--navy:#14382F;--navy-2:#1B4B3F;--navy-3:#236152;--ink:#14382F;--gold:#C49A4A;--gold-ink:#8E6D2E;--gold-light:#D6B880}</style>
</head>
<body>
<main id="main"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="معرض الصور" aria-hidden="true">
  <div class="lb__head"><span id="lb-count" class="num"></span><button type="button" class="icon-btn" id="lb-close" aria-label="إغلاق المعرض"></button></div>
  <div class="lb__stage" id="lb-stage"></div>
  <button type="button" class="lb__nav lb__prev" id="lb-prev" aria-label="الصورة السابقة"></button>
  <button type="button" class="lb__nav lb__next" id="lb-next" aria-label="الصورة التالية"></button>
</div>

<!--ID--><script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
  var U = UI, K = SITE, $ = U.$, $$ = U.$$, I = U.I;
  U.mountChrome('buy');
  var id = window.PAGE_ID || new URLSearchParams(location.search).get('id') || K.listings[0].id;
  var l = U.byId(id);
  var main = $('#main');
  if (!l) {
    main.innerHTML = '<div class="container" style="padding:96px 20px;text-align:center"><h1 class="title">العقار غير موجود</h1><p style="color:var(--muted);margin:12px 0 24px">ممكن يكون انباع أو انشال.</p><a class="btn btn--primary" href="listings.html">تصفّح العقارات</a></div>';
    return;
  }
  var sold = l.status === 'sold';
  document.title = l.title + ' – ' + U.place(l) + ' | ' + K.brand.name;
  var ref = U.refOf(l);
  var msg = 'مرحبا، بدي استفسر عن العرض رقم ' + ref + ' (' + l.title + ' – ' + U.place(l) + ')';
  var photos = l.photos || [];

  // gallery markup
  var mosaicCls = photos.length === 1 ? ' one' : photos.length === 2 ? ' two' : photos.length === 3 ? ' three' : photos.length === 4 ? ' four' : '';
  var gallery = photos.length ?
    '<div class="pd-gallery">' +
      '<div class="pd-rail" id="pd-rail">' + photos.map(function (p, i) { return '<button type="button" data-open="' + i + '" aria-label="فتح الصورة ' + (i + 1) + '"><img src="' + U.img(p) + '" alt="' + U.esc(l.title) + ' – صورة ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '></button>'; }).join('') + '</div>' +
      '<span class="pd-count num" id="pd-count">1 / ' + photos.length + '</span>' +
      '<div class="pd-top"><a class="icon-btn" href="listings.html" aria-label="رجوع للعقارات">' + I.back + '</a><div><button type="button" class="icon-btn" data-share aria-label="مشاركة">' + I.share + '</button>' + (sold ? '' : '<button type="button" class="icon-btn" data-save="' + l.id + '" aria-pressed="false" aria-label="حفظ العقار">' + I.heart + '</button>') + '</div></div>' +
      '<div class="container"><div class="mosaic' + mosaicCls + '">' + photos.slice(0, 5).map(function (p, i) { return '<button type="button" data-open="' + i + '" aria-label="فتح الصورة ' + (i + 1) + '"><img src="' + U.img(p) + '" alt=""' + (i ? ' loading="lazy"' : '') + '></button>'; }).join('') +
        '<button type="button" class="mosaic__all" data-open="0">' + I.grid + 'عرض كل الصور (' + photos.length + ')</button></div></div>' +
    '</div>'
    : '<div class="container"><div class="pd-noimg"><div>' + U.markHtml() + '<p style="color:#B7C2D3;margin-top:6px">الصور متوفرة عند الطلب، راسلنا لنبعتلك جولة فيديو</p></div></div></div>';

  var stats = [];
  if (l.size) stats.push([U.sizeText(l), l.sizeApprox ? 'المساحة الإجمالية' : 'المساحة']);
  if (l.outdoor) stats.push([l.outdoor + ' م²', 'مساحة خارجية']);
  if (l.beds) stats.push([l.beds, 'غرف نوم']);
  if (l.baths) stats.push([l.baths, 'حمامات']);
  if (l.floor && stats.length < 4) stats.push([l.floor, /^ال/.test(l.floor) ? 'الطابق' : 'النوع']);
  if (l.facing && stats.length < 4) stats.push([l.facing, 'الاتجاه']);

  var facts = [
    ['رقم العرض', ref], ['الحالة', U.statusLabel[l.status]], ['النوع', l.type], ['المنطقة', U.place(l)],
    ['المساحة', U.sizeText(l)], ['مساحة خارجية', l.outdoor ? l.outdoor + ' م²' : ''], ['غرف النوم', l.beds || ''], ['الحمامات', l.baths || ''],
    ['الطابق', l.floor || ''], ['الاتجاه', l.facing || ''], ['الكسوة', l.finish || '']
  ].filter(function (f) { return f[1] !== '' && f[1] != null; });

  var ppm = (!sold && l.price && l.size && !l.priceUnit) ? Math.round(l.price / l.size) : null;
  var similar = K.listings.filter(function (x) { return x.id !== l.id && x.status !== 'sold'; })
    .sort(function (a, b) { return (b.area === l.area) - (a.area === l.area); }).slice(0, 4);

  main.innerHTML =
    gallery +
    '<div class="container">' +
      '<nav class="crumbs" aria-label="مسار التصفح"><a href="index.html">الرئيسية</a><span>/</span><a href="listings.html?status=' + l.status + '">' + U.statusLabel[l.status] + '</a><span>/</span><a href="listings.html?area=' + encodeURIComponent(l.area) + '">' + U.esc(l.area) + '</a><span>/</span><span>' + ref + '</span></nav>' +
      '<div class="pd">' +
        '<div>' +
          '<header class="pd-head">' +
            '<div class="pd-tags"><span class="tag ' + (sold ? 'tag--sold' : 'tag--navy') + '">' + U.statusLabel[l.status] + '</span>' + (l.signature ? '<span class="tag tag--gold">عقار استثنائي</span>' : '') + (l.isNew && !sold ? '<span class="tag">جديد</span>' : '') + '<span class="tag">' + ref + '</span></div>' +
            '<div class="pd-price"><b class="num">' + U.priceText(l) + '</b>' + (U.priceSub(l) ? '<small>' + U.esc(U.priceSub(l)) + '</small>' : '') + '</div>' +
            '<h1 class="pd-title">' + U.esc(l.title) + '</h1>' +
            '<div class="pd-addr">' + I.pin + '<span>' + U.esc(U.place(l)) + (l.area !== K.city ? '، ' + K.city : '') + '</span></div>' +
            (stats.length ? '<div class="pd-stats">' + stats.slice(0, 4).map(function (s) { return '<div><b>' + U.esc(s[0]) + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div>' : '') +
          '</header>' +
          '<nav class="pd-tabs" aria-label="أقسام الصفحة" id="pd-tabs"><a href="#overview" class="on">نظرة عامة</a><a href="#facts">المواصفات</a>' + (l.video ? '<a href="#tour">جولة فيديو</a>' : '') + (K.areas[l.area] ? '<a href="#location">الموقع</a>' : '') + '</nav>' +
          '<section class="pd-sec" id="overview"><h2>نظرة عامة</h2>' + (l.desc && l.desc.length ? l.desc.map(function (p) { return '<p>' + U.esc(p) + '</p>'; }).join('') : '<p>للتفاصيل الكاملة عن هالعقار، تواصل معنا.</p>') +
            (l.post ? '<p style="margin-top:16px"><a class="link-arrow" href="' + l.post + '" target="_blank" rel="noopener">كل صور العرض على إنستغرام</a></p>' : '') +
            (ppm ? '<div class="ppm" style="margin-top:20px"><div><span>سعر المتر تقريباً</span><b class="num">' + U.fmt(ppm) + '</b></div><div><span>المساحة</span><b>' + U.sizeText(l) + '</b></div></div>' : '') +
          '</section>' +
          '<section class="pd-sec" id="facts"><h2>المواصفات</h2><dl class="facts">' + facts.map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + U.esc(f[1]) + '</dd></div>'; }).join('') + '</dl>' +
            (l.features && l.features.length ? '<h3 style="font-size:17px;margin-top:28px">المزايا</h3><ul class="features">' + l.features.map(function (f) { return '<li>' + I.check + '<span>' + U.esc(f) + '</span></li>'; }).join('') + '</ul>' : '') +
          '</section>' +
          (l.video ? '<section class="pd-sec" id="tour"><h2>جولة فيديو</h2><a class="tour" href="' + l.video + '" target="_blank" rel="noopener"><img src="' + U.img(photos[photos.length - 1] || photos[0]) + '" alt="" loading="lazy"><span class="tour__play">' + I.play + '</span><span class="tour__cap">شاهد الجولة الكاملة على إنستغرام</span></a></section>' : '') +
          (K.areas[l.area] ? '<section class="pd-sec" id="location" style="border-bottom:none"><h2>الموقع</h2><p style="margin-bottom:16px">' + U.esc(U.place(l)) + ' · ' + K.areas[l.area].blurb + '. العنوان الدقيق بيتحدد وقت المعاينة.</p><div class="pd-map" id="pd-map" dir="ltr"></div></section>' : '') +
        '</div>' +
        '<aside class="agent" aria-label="تواصل بخصوص العقار">' +
          '<div class="agent__top' + (K.brand.arabic ? ' brand--ar' : '') + '"><span class="brand__mark">' + U.esc(K.brand.mark) + '</span><div><b>فريق ' + U.esc(K.brand.name) + '</b><span>' + U.esc(K.agentNote || '') + '</span></div></div>' +
          '<div class="agent__body">' +
            '<a class="btn btn--wa btn--block" target="_blank" rel="noopener" href="' + U.wa(msg) + '">' + I.wa + 'استفسر على الواتساب</a>' +
            '<a class="btn btn--line btn--block" href="tel:' + K.phone + '">' + I.phone + 'اتصل الآن</a>' +
          '</div>' +
          (sold ? '' : '<form id="visit"><h3>احجز معاينة</h3>' +
            '<label>الاسم<input name="name" required autocomplete="name"></label>' +
            '<label>رقم الموبايل أو الواتساب<input name="phone" type="tel" required autocomplete="tel" dir="ltr" style="text-align:right"></label>' +
            '<label>نوع المعاينة<select name="kind"><option>زيارة على العقار</option><option>جولة فيديو مباشرة (للمغتربين)</option></select></label>' +
            '<button class="btn btn--primary btn--block" type="submit">أرسل الطلب</button></form>') +
        '</aside>' +
      '</div>' +
    '</div>' +
    (similar.length ? '<section class="similar"><div class="container"><div class="sec-head"><div><span class="eyebrow">ممكن يعجبك كمان</span><h2 class="title" style="font-size:clamp(24px,3vw,32px)">عقارات مشابهة</h2></div><div class="rail-nav" data-rail="rail-sim"><button type="button" data-dir="prev" aria-label="السابق">' + I.chevR + '</button><button type="button" data-dir="next" aria-label="التالي">' + I.chevL + '</button></div></div><div class="rail" id="rail-sim">' + similar.map(function (x) { return U.card(x); }).join('') + '</div></div></section>' : '') +
    '<div class="pd-bar"><div class="pd-bar__price"><b class="num">' + U.priceText(l) + '</b><span>' + U.esc(U.place(l)) + '</span></div>' +
      '<a class="btn btn--line" href="tel:' + K.phone + '" aria-label="اتصال">' + I.phone + '</a>' +
      '<a class="btn btn--wa" target="_blank" rel="noopener" href="' + U.wa(msg) + '">' + I.wa + 'واتساب</a></div>';

  // mobile rail counter
  var rail = $('#pd-rail');
  if (rail) rail.addEventListener('scroll', function () { $('#pd-count').textContent = (Math.round(Math.abs(rail.scrollLeft) / rail.clientWidth) + 1) + ' / ' + photos.length; }, { passive: true });

  // lightbox
  var lb = $('#lb'), stage = $('#lb-stage'), lastFocus;
  $('#lb-close').innerHTML = I.close; $('#lb-prev').innerHTML = I.chevR; $('#lb-next').innerHTML = I.chevL;
  stage.innerHTML = photos.map(function (p, i) { return '<figure><img src="' + U.img(p) + '" alt="' + U.esc(l.title) + ' – صورة ' + (i + 1) + '" loading="lazy"></figure>'; }).join('');
  var cur = function () { return Math.round(Math.abs(stage.scrollLeft) / stage.clientWidth); };
  var upd = function () { $('#lb-count').textContent = (cur() + 1) + ' / ' + photos.length; };
  var openLb = function (i) {
    lastFocus = document.activeElement;
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.classList.add('lock');
    stage.scrollTo({ left: -i * stage.clientWidth }); if (Math.abs(stage.scrollLeft) !== i * stage.clientWidth) stage.scrollLeft = -i * stage.clientWidth;
    upd(); $('#lb-close').focus();
  };
  var closeLb = function () { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.classList.remove('lock'); if (lastFocus) lastFocus.focus(); };
  var step = function (d) { stage.scrollBy({ left: -d * stage.clientWidth, behavior: 'smooth' }); };
  stage.addEventListener('scroll', upd, { passive: true });
  $('#lb-close').addEventListener('click', closeLb);
  $('#lb-next').addEventListener('click', function () { step(1); });
  $('#lb-prev').addEventListener('click', function () { step(-1); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') step(1); if (e.key === 'ArrowRight') step(-1);
  });
  $$('[data-open]').forEach(function (b) { b.addEventListener('click', function () { openLb(+b.dataset.open); }); });

  // share
  $$('[data-share]').forEach(function (b) {
    b.addEventListener('click', function () {
      var data = { title: l.title, text: l.title + ' – ' + U.place(l), url: location.href };
      if (navigator.share) navigator.share(data).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { U.toast('انتسخ رابط العقار'); });
    });
  });

  // visit form -> whatsapp
  var vf = $('#visit');
  if (vf) vf.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = 'طلب معاينة للعقار ' + ref + ' (' + l.title + ')\nالاسم: ' + vf.name.value + '\nالرقم: ' + vf.phone.value + '\nنوع المعاينة: ' + vf.kind.value;
    window.open(U.wa(t), '_blank', 'noopener');
  });

  // section tabs highlight
  var tabs = $$('#pd-tabs a');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) tabs.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id); }); });
    }, { rootMargin: '-45% 0px -50% 0px' });
    tabs.forEach(function (a) { var s = $(a.getAttribute('href')); if (s) io.observe(s); });
  }

  // map
  var a = K.areas[l.area];
  if (a && $('#pd-map')) {
    if (window.L) {
      var m = L.map('pd-map', { scrollWheelZoom: false }).setView(a.coords, 14);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(m);
      L.circle(a.coords, { radius: 600, color: K.colors.accent, weight: 2, fillColor: K.colors.accent, fillOpacity: .15 }).addTo(m);
    } else { $('#pd-map').innerHTML = '<p class="map-note" style="padding:20px">الخريطة بحاجة اتصال بالإنترنت.</p>'; }
  }

  U.wireCards(document); U.wireRails(); U.syncSaved();
})();
</script>
</body>
</html>
